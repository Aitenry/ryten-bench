appId: com.ryten.bench
productName: RytenBench
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!drizzle/**'
  # 安装目录下的运行期存储根（dev 态会出现在仓库根）：绝不能打进安装包
  - '!data/**'
  # 沙箱资产只走 extraResources（下面的 `from: resources/sandbox → to: sandbox`）：
  # 不排除的话它会被同时塞进 asar（再被 asarUnpack 解出来）和 resourcesPath 两份，
  # 而 service.ts 的 resolveSandboxAsset 在打包态会先命中 asar 里那份 → 路径不确定。
  # 排除后：开发态走 <仓库>/resources/sandbox，打包态只走 <resourcesPath>/sandbox。
  - '!resources/sandbox/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!drizzle.config.ts'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # 仓库里的本地开发/调试产物绝不能进安装包（2026-11-27 实测：不排除时 app.asar 会从
  # ~450MB 膨胀到 3.3GB，多出来的全是 test/.tmp/.dsh-* 等本地目录，既拖慢安装包也泄露
  # 设计文档与调试数据）：
  - '!test/**'
  - '!tests/**'
  - '!scripts/**'
  - '!docs/**'
  - '!mockup/**'
  - '!.tmp/**'
  - '!.tmp-cdp-profile/**'
  # 构建输出目录（默认 dist、以及本地验证用的 dist-*）：绝不能相互嵌套进 asar
  - '!dist/**'
  - '!dist-*/**'
  - '!.dsh-design/**'
  - '!.dsh-vision-toolkit/**'
  - '!.tooling/**'
  - '!.trae/**'
  - '!.idea/**'
  - '!.agents/**'
  - '!.github/**'
  - '!*.tsbuildinfo'
  # 注意：**不要**在这里排除 `node_modules/esbuild/**`。
  # asarUnpack 的语义是「先打进 asar，再复制一份到 app.asar.unpacked」——
  # 用 files 排除掉它，就没有任何东西可解，两份都会消失
  # （2026-09-29 试过，asar 里 0 条、unpacked 里也没有，构建直接坏掉）。
  # asar 里存在一份是无害的，只要加载器优先用 app.asar.unpacked（见
  # src/main/workshop/wiring.ts 的 loaderBases）。
asarUnpack:
  - resources/**
  # koffi 是原生 FFI 绑定（沙箱 runner 用它调 Win32 API）：.node 不能从 asar 里加载
  - '**/koffi/**'
  # node-pty 是用户侧真终端的原生 PTY 绑定（N-API 预编译）：.node 同样必须解包
  - '**/node-pty/**'
  # 插件工坊在**打包后的应用里**也要构建插件：workshop/host.ts 的 createNodeLoader 从
  # app.asar.unpacked 解析 esbuild / tailwindcss / jszip。asar 里的文件既读不出来、
  # 也不能被 spawn，而 esbuild 的 JS 主模块要 spawn 平台二进制
  # （@esbuild/<platform>/esbuild.exe），所以整棵树都必须解包。
  # 前置条件：esbuild 必须在 dependencies 里——只在 devDependencies（原先只有
  # drizzle-kit / electron-vite / vite 传递依赖它）会被上面的 files 规则排除，
  # 装出来的应用里根本没有它，表现就是工坊「构建 / 更新安装均失败，本地却正常」
  # （2026-09-29 真机根因）。
  - '**/esbuild/**'
  - '**/@esbuild/**'
extraResources:
  # drizzle 迁移文件（由 pnpm drizzle-kit generate 生成），启动时由 src/main/database/orm.ts 按序应用
  - from: drizzle
    to: database/drizzle
  - from: resources/models-profile.json
    to: models-profile.json
  # 沙箱自带资产（Windows 受限令牌 runner / Linux Landlock 启动器）：
  # 放 resources/sandbox 而不是 asar 里——它们要被当成独立进程 spawn，
  # 且 Linux 启动器需要保住可执行位（见 src/main/sandbox/service.ts）
  - from: resources/sandbox
    to: sandbox
win:
  executableName: RytenBench
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  createDesktopShortcut: always
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
mac:
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
