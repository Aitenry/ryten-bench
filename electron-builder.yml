appId: com.ryten.bench
productName: RytenBench
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!drizzle/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!drizzle.config.ts'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # koffi 是原生 FFI 绑定（沙箱 runner 用它调 Win32 API）：.node 不能从 asar 里加载
  - '**/koffi/**'
extraResources:
  # drizzle 迁移文件（由 pnpm drizzle-kit generate 生成），启动时由 src/main/database/orm.ts 按序应用
  - from: drizzle
    to: database/drizzle
  - from: resources/models-profile.json
    to: models-profile.json
  # 沙箱自带资产（Windows 受限令牌 runner / Linux Landlock 启动器）：
  # 放 resources/sandbox 而不是 asar 里——它们要被当成独立进程 spawn，
  # 且 Linux 启动器需要保住可执行位（见 src/plugins/harness/main/sandbox/service.ts）
  - from: resources/sandbox
    to: sandbox
  # 插件包（由 pnpm build:plugins 生成：resources/plugins/<id>/{plugin.json,main.cjs,renderer.mjs,chunk-*.mjs}）
  # 首次启动时整包 copy 到 userData/plugins/<id>/，此后与第三方插件走同一条装载链路（见 src/plugins/PACKAGING.md）
  - from: resources/plugins
    to: plugins
win:
  executableName: RytenBench
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  createDesktopShortcut: always
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
mac:
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
