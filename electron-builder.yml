appId: com.ryten.bench
productName: RytenBench
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!drizzle/**'
  # Runtime storage root under the install directory (appears at the repo root in dev): must never be packaged
  - '!data/**'
  # Sandbox assets only go through extraResources (`from: resources/sandbox → to: sandbox` below):
  # without excluding them they get packed into asar (then extracted again by asarUnpack) as well as into resourcesPath,
  # and resolveSandboxAsset in service.ts hits the asar copy first in packaged mode → nondeterministic path.
  # After exclusion: dev mode uses <repo>/resources/sandbox, packaged mode only uses <resourcesPath>/sandbox.
  - '!resources/sandbox/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!drizzle.config.ts'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Local dev/debug artifacts in the repo must never enter the installer (measured on 2026-11-27: without these exclusions app.asar
  # grows from ~450MB to 3.3GB, all of it local directories such as test/.tmp/.dsh-*, which both slows the installer and leaks
  # design documents and debug data):
  - '!test/**'
  - '!tests/**'
  - '!scripts/**'
  - '!docs/**'
  - '!mockup/**'
  - '!.tmp/**'
  - '!.tmp-cdp-profile/**'
  # Build output directories (dist by default, plus the dist-* used for local verification): must never be nested into asar
  - '!dist/**'
  - '!dist-*/**'
  - '!.dsh-design/**'
  - '!.dsh-vision-toolkit/**'
  - '!.tooling/**'
  - '!.trae/**'
  - '!.idea/**'
  - '!.agents/**'
  - '!.github/**'
  - '!*.tsbuildinfo'
  # Note: **do not** exclude `node_modules/esbuild/**` here.
  # asarUnpack means "pack into asar first, then copy a copy into app.asar.unpacked" —
  # excluding it via files leaves nothing to extract and both copies disappear
  # (tried on 2026-09-29: 0 entries in asar, none in unpacked either, the build broke outright).
  # Having one copy inside asar is harmless as long as the loader prefers app.asar.unpacked (see
  # loaderBases in src/main/workshop/wiring.ts).
asarUnpack:
  - resources/**
  # koffi is the native FFI binding (the sandbox runner uses it to call Win32 APIs): .node cannot be loaded from inside asar
  - '**/koffi/**'
  # node-pty is the native PTY binding for the user-facing real terminal (N-API prebuilt): its .node must be unpacked too
  - '**/node-pty/**'
  # The plugin workshop must also build plugins **inside the packaged app**: createNodeLoader in
  # workshop/host.ts resolves esbuild / tailwindcss / jszip from app.asar.unpacked. Files inside asar can
  # neither be read nor spawned, and esbuild's JS main module needs to spawn the platform binary
  # (@esbuild/<platform>/esbuild.exe), so the whole tree must be unpacked.
  # Prerequisite: esbuild must be in dependencies — if it is only in devDependencies (originally only
  # drizzle-kit / electron-vite / vite depended on it transitively) it gets excluded by the files rules above,
  # and the installed app does not have it at all, manifesting as the workshop "build / update install both fail while local works"
  # (real-device root cause on 2026-09-29).
  - '**/esbuild/**'
  - '**/@esbuild/**'
extraResources:
  # drizzle migration files (generated by pnpm drizzle-kit generate), applied in order at startup by src/main/database/orm.ts
  - from: drizzle
    to: database/drizzle
  - from: resources/models-profile.json
    to: models-profile.json
  # Sandbox's own assets (Windows restricted-token runner / Linux Landlock launcher):
  # placed under resources/sandbox rather than in asar — they must be spawned as standalone processes,
  # and the Linux launcher needs to keep its executable bit (see src/main/sandbox/service.ts)
  - from: resources/sandbox
    to: sandbox
win:
  executableName: RytenBench
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  createDesktopShortcut: always
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
mac:
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
