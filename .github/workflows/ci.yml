name: CI

# Daily quality gate (PRs / pushes to non-main branches).
#
# Division of labor with release.yml:
# - release.yml runs the release pipeline only on pushes to main (version resolution → three-platform packaging → publish);
# - this workflow blocks regressions before merge: typecheck + ESLint errors.
#
# The offline suites under tests/ (and their runner in scripts/) are local tooling and are not
# tracked, so this workflow does not run them; run `pnpm test:all` locally instead.
on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Only fail on errors (prettier formatting warnings are pre-existing; --quiet suppresses warnings)
      - name: Lint (errors only)
        run: pnpm lint:errors
