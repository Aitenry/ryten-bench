name: Build RytenBench 0.1.0-alpha

# 发布构建由 main 触发：日常在 0.1.0 上开发，合并进 main 后自动出包。
# 注意 0.1.0 是非默认分支，直接推它只会触发 GitHub 的「recent pushes」横幅，不会出包。
on:
  push:
    branches:
      - 'main'

concurrency:
  group: release-0.1.0
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_PREFIX: 0.1.0-alpha
  STABLE_COMMIT: 9aec745a55638dcec38ce3c61c0d1ddaacca3640

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            script: build:win
            artifact_pattern: dist/*.exe
          - platform: macos
            os: macos-latest
            script: build:mac
            artifact_pattern: |
              dist/*.dmg
              dist/*.zip
          - platform: linux
            os: ubuntu-latest
            script: build:linux
            artifact_pattern: |
              dist/*.AppImage
              dist/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # 沙箱资产（resources/sandbox）由 build:sandbox 产出，而 build:win/mac/linux 的第一步就是它；
      # 下面两步分别验证「资产构建成功」与「装进产物」，任何一步失败都让发布停下来
      # ——否则会出现「装完即用」失效：后端缺失 → 命令被故障关闭、直接拒绝执行。
      - name: Build installer
        run: pnpm ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify sandbox assets were built
        shell: bash
        run: |
          set -euo pipefail
          test -f resources/sandbox/win32-sandbox-runner.cjs
          case "${{ matrix.platform }}" in
            linux)
              launcher=$(ls resources/sandbox/linux-*/ryten-landlock-launcher | head -n1)
              test -n "${launcher}"
              test -x "${launcher}"
              # 真跑一次：证明这个内核上「自限 + exec」确实可用（不是只编出了个文件）
              "${launcher}" --ro / --rw /dev -- true
              echo "Linux 启动器可用：${launcher}"
              ;;
            macos)
              echo "macOS 用系统自带 sandbox-exec，无需自带二进制"
              ;;
          esac
          ls -la resources/sandbox

      # 真正的闸门：拿**打包产物**里的沙箱做一次真机自检（Windows 用产物里的 Electron
      # 二进制跑 runner、Linux 跑自研启动器），含「工作区外写入必须被拒」与「对照组可写」。
      # 这一步曾经不存在，于是「runner 在 Electron 里崩」这类只在打包后才暴露的问题没人拦。
      - name: Verify the packaged app carries a working sandbox
        run: node native/build-sandbox.mjs --selfcheck

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error

  release:
    name: Publish 0.1.0-alpha release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'main'
          fetch-depth: 0
          fetch-tags: true

      - name: Count commits since stable release
        id: commits
        run: echo "count=$(git rev-list --count ${{ env.STABLE_COMMIT }}..HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve next release version
        id: version
        uses: actions/github-script@v7
        env:
          RELEASE_PREFIX: ${{ env.RELEASE_PREFIX }}
          STABLE_COMMIT: ${{ env.STABLE_COMMIT }}
          COMMIT_COUNT: ${{ steps.commits.outputs.count }}
        with:
          script: |
            const prefix = process.env.RELEASE_PREFIX
            const escapedPrefix = prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            const pattern = new RegExp(`^${escapedPrefix}\\.(\\d+)\\.(\\d+)$`)
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            })

            let previousTag = process.env.STABLE_COMMIT || ''
            let best = null
            for (const release of releases) {
              const match = pattern.exec(release.tag_name)
              if (!match) continue
              const candidate = [Number(match[1]), Number(match[2])]
              if (!best || candidate[0] > best[0] || (candidate[0] === best[0] && candidate[1] > best[1])) {
                best = candidate
                previousTag = release.tag_name
              }
            }

            const commitCount = Math.max(1, Number(process.env.COMMIT_COUNT || '0'))
            let nextVersion
            if (best && best[0] === commitCount) {
              nextVersion = `${prefix}.${commitCount}.${best[1] + 1}`
            } else {
              nextVersion = `${prefix}.${commitCount}.1`
            }

            core.setOutput('version', nextVersion)
            core.setOutput('previous_tag', previousTag)

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: release/windows

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: release/macos

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: installer-linux
          path: release/linux

      - name: Compose release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "${PREVIOUS_TAG}" ]; then
            git log --no-merges --pretty=format:'- %s' "${PREVIOUS_TAG}..HEAD" > changes.txt 2>/dev/null || true
          fi
          if [ ! -s changes.txt ]; then
            printf '%s\n' '- Current branch build.' > changes.txt
          fi
          {
            echo '## Changes'
            cat changes.txt
            echo
            echo '## Build Info'
            echo "- Version: ${VERSION}"
            echo "- Commit: ${SHA}"
            echo '- Platforms: Windows (NSIS), macOS (DMG/ZIP), Linux (AppImage/DEB)'
          } > release-body.md
          echo "path=release-body.md" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release/windows/*.exe
            release/macos/*.dmg
            release/macos/*.zip
            release/linux/*.AppImage
            release/linux/*.deb
          fail_on_unmatched_files: false
          make_latest: true
