name: Release

# Stable releases (policy 2026-10: "everything from now on is a real version").
#
# - Only main produces builds; every push to main is one stable release.
# - Manual workflow_dispatch with republish=true rebuilds the current stable version and overwrites
#   its release assets (a same-version content update; clients detect it via contentSha256).
# - Version numbers are no longer assembled from "commit counts" (the old 0.1.0-alpha.<commit-count>.<retry> was fake);
#   they are computed by .github/scripts/resolve-version.mjs from the previous stable tag + this batch's commit types:
#     · feat                → minor (0.1.1 → 0.2.0)
#     · fix / anything else → patch (0.1.0 → 0.1.1)
#     · BREAKING CHANGE     → major (0.1.x → 1.0.0)
#     · [release:major|minor|patch] → forced in the commit message
#   The first stable release takes 0.1.0 directly from package.json (historical alpha tags do not participate).
# - Tags always carry a `v` prefix (v0.1.0 / v0.1.1 / v1.0.0): development branches are named after versions
#   (0.1.0, 0.2.0 …); when a branch and a tag share a name, git resolves the bare name to the tag first, and
#   `git merge 0.2.0` on main silently merges nothing. With the `v` prefix the two are never ambiguous.
# - Before building, write the computed version into package.json: the installer file name and app.getVersion() (the version number in settings)
#   both use this real number, not the stale 0.1.0 in the repo.
# - After a successful release, write this version back to main (`chore(release): … [skip ci]`): the version in the repo
#   always equals the one just released. That commit does not participate in the next bump calculation.
# - A run already in progress is not cancelled by a new push (cancel-in-progress: false); when two pushes are close together
#   they queue, and the later one continues computing the version from the new tag.
on:
  push:
    branches:
      - 'main'
  # Only trigger manually when "the last build failed and needs a rerun"; an already-released version is skipped automatically (should_release=false)
  workflow_dispatch:
    inputs:
      republish:
        description: 'Rebuild the current version and overwrite the existing release assets (content update, no version bump)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      bump: ${{ steps.resolve.outputs.bump }}
      should_release: ${{ steps.resolve.outputs.should_release }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: either compute commits from the previous stable tag, or read nothing at all
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve next version
        id: resolve
        env:
          # Manual same-version content rebuild: reuse the latest stable tag and overwrite its
          # release assets. The app detects the new content via contentSha256, not the version.
          REPUBLISH: ${{ inputs.republish }}
        run: node .github/scripts/resolve-version.mjs

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            script: build:win
            artifact_pattern: |
              dist/*.exe
              dist/latest.yml
              dist/*.blockmap
          - platform: macos
            os: macos-latest
            script: build:mac
            artifact_pattern: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml
              dist/*.blockmap
          - platform: linux
            os: ubuntu-latest
            script: build:linux
            artifact_pattern: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux.yml
              dist/*.blockmap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The version number must be written in **before** packaging: electron-builder uses it to name the installer and to write
      # package.json inside app.asar (app.getVersion() returns it).
      - name: Stamp the release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs')
            const file = 'package.json'
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
            pkg.version = process.env.RELEASE_VERSION
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')
          "
          node -e "console.log('packaging version ' + require('./package.json').version)"

      - name: Typecheck
        run: pnpm typecheck

      # The offline suites under tests/ (and their runner in scripts/) are local tooling and are not
      # tracked, so the release pipeline only gates on typecheck plus ESLint errors.

      # Only fail on ESLint errors (pre-existing prettier formatting warnings do not block release)
      - name: Lint (errors only)
        run: pnpm lint:errors

      # Sandbox assets (resources/sandbox) are produced by build:sandbox, which is the first step of build:win/mac/linux;
      # the next two steps verify "assets built successfully" and "packed into the artifact" respectively, and any failure stops the release
      # — otherwise "works right out of the box" breaks: a missing backend → commands are disabled and rejected outright.
      - name: Build installer
        run: pnpm ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Same-version content updates: latest*.yml gets the SHA-256 of the packaged app.asar so the
      # app can detect a rebuilt package even when the semantic version did not change. This must
      # run before the metadata is uploaded.
      - name: Stamp update content hash
        run: node .github/scripts/stamp-update-content-hash.mjs

      - name: Verify sandbox assets were built
        shell: bash
        run: |
          set -euo pipefail
          test -f resources/sandbox/win32-sandbox-runner.cjs
          case "${{ matrix.platform }}" in
            linux)
              launcher=$(ls resources/sandbox/linux-*/ryten-landlock-launcher | head -n1)
              test -n "${launcher}"
              test -x "${launcher}"
              # Actually run it once: prove that "self-limit + exec" really works on this kernel (not just that a file was compiled)
              "${launcher}" --ro / --rw /dev -- true
              echo "Linux 启动器可用：${launcher}"
              ;;
            macos)
              echo "macOS 用系统自带 sandbox-exec，无需自带二进制"
              ;;
          esac
          ls -la resources/sandbox

      # The real gate: run an on-device self-check with the sandbox from the **packaged artifact** (on Windows run the runner with the
      # Electron binary from the artifact, on Linux run the custom launcher), including "writes outside the workspace must be rejected" and "the control group can write".
      # This step used to be missing, so problems that only surface after packaging ("the runner crashes inside Electron") went uncaught.
      - name: Verify the packaged app carries a working sandbox
        run: node native/build-sandbox.mjs --selfcheck

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the commit from the event: the tag and notes must point at the commit that was **actually packaged**
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: release/windows

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: release/macos

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: installer-linux
          path: release/linux

      - name: Compose release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUMP: ${{ needs.version.outputs.bump }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PREVIOUS_TAG}" ]; then
            git log --no-merges --pretty=format:'- %s (%h)' "${PREVIOUS_TAG}..${SHA}" > all-changes.txt
          else
            # First stable release: no tag to compare against, list the last 40 commits to show what this build contains
            git log --no-merges --pretty=format:'- %s (%h)' -n 40 "${SHA}" > all-changes.txt
          fi
          head -n 60 all-changes.txt > changes.txt || true
          if [ ! -s changes.txt ]; then
            printf '%s\n' '- 版本号回写与文档更新。' > changes.txt
          fi
          {
            echo '## Changes'
            cat changes.txt
            echo
            echo '## Build Info'
            echo "- Version: ${VERSION}"
            echo "- Bump: ${BUMP}"
            echo "- Commit: ${SHA}"
            echo '- Platforms: Windows (NSIS), macOS (DMG/ZIP), Linux (AppImage/DEB)'
          } > release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          # Title only carries the version: the tag is v0.1.0, but the release page still reads "0.1.0"
          name: ${{ needs.version.outputs.version }}
          body_path: release-body.md
          files: |
            release/windows/*.exe
            release/windows/latest.yml
            release/windows/*.blockmap
            release/macos/*.dmg
            release/macos/*.zip
            release/macos/latest-mac.yml
            release/macos/*.blockmap
            release/linux/*.AppImage
            release/linux/*.deb
            release/linux/latest-linux.yml
            release/linux/*.blockmap
          # Don't publish if any platform's artifact is missing: better to fail this run than ship a stable release with only half the files
          fail_on_unmatched_files: true
          # Same-version republish replaces the existing assets in place; the content hash in
          # latest*.yml is what tells clients that the payload changed.
          overwrite_files: true
          prerelease: false
          make_latest: true

  # Record the just-released version back into the repo: from then on package.json's version == the latest stable release,
  # so the next person picking this up (or the next workflow run) does not see a stale 0.1.0.
  stamp:
    name: Record ${{ needs.version.outputs.version }} in package.json
    needs: [version, release]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: 'main'
          fetch-depth: 0

      - name: Commit the released version back to main
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node -e "
            const fs = require('fs')
            const file = 'package.json'
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
            pkg.version = process.env.VERSION
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')
          "
          if git diff --quiet -- package.json; then
            echo "package.json 已经是 ${VERSION}，无需回写"
            exit 0
          fi
          git add package.json
          git commit -m "chore(release): ${VERSION} [skip ci]"
          # If someone pushed to main during the release, rebase first and push again; if it still fails, let this step fail loudly
          git push origin HEAD:main || { git pull --rebase origin main; git push origin HEAD:main; }
